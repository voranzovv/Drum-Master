<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard - Drum</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Keyboard - Drum</h1>
      <p>Press the keys A, S, D, F, G, H, J, K to play the drum sounds.</p>

      <div class="dashboard">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
        <div class="box">13</div>
        <div class="box">14</div>
        <div class="box">15</div>
        <div class="box">16</div>
      </div>
      <!-- play the beat button  -->
      <button id="playBeat">Play Beat</button>

      <!-- stop the beat button  -->
      <button id="stopBeat">Stop Beat</button>

      <div class="drum-container">
        <div class="beat kick">Kick</div>
        <div class="beat snare">Snare</div>
        <div class="beat clap">Clap</div>
        <div class="beat hi-hat">Hi-Hat</div>
      </div>
    </div>
  </body>
  <script src="https://unpkg.com/tone"></script>
  <script src="script.js"></script>
</html>
