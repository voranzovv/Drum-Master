<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard - Drum</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Keyboard - Drum</h1>
      <p>Press the keys A, S, D, F, G, H, J, K to playay the drum sounds.</p>

      <div class="dashboard">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>

      <div class="drum-container">
        <div class="beat kick">Kick</div>
        <div class="beat snare">Snare</div>
        <div class="beat clap">Clap</div>
        <div class="beat hi-hat">Hi-Hat</div>
      </div>
    </div>
  </body>
</html>
